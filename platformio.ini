[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

upload_port = COM11
; 921600 (the default) is unreliable on this board's CP2102.
upload_speed = 460800
monitor_port = COM11
monitor_speed = 115200
; The CLI echoes typed characters itself; send keystrokes raw.
monitor_filters = direct
monitor_echo = no
