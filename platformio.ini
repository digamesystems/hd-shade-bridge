; `pio run` builds the board firmware only. Host tests: `pio test -e native`.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

upload_port = COM11
; 921600 (the default) is unreliable on this board's CP2102.
upload_speed = 460800
monitor_port = COM11
monitor_speed = 115200
; The CLI echoes typed characters itself; send keystrokes raw.
monitor_filters = direct
monitor_echo = no
; nRF24 driver, the same version as HD_Remote_Clone (src/radio.cpp).
lib_deps =
    nrf24/RF24@1.4.11
; Host tests aren't built for the board.
test_ignore = test_native_*

; Host tests of lib/bridgecore (no Arduino, no board): `pio test -e native`.
; Needs a host C++ compiler (here MSYS2's g++).
[env:native]
platform = native
test_ignore = test_device_*
build_flags =
    -std=gnu++17
    -Wall
